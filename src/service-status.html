<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>XtremeGuard Parking - Service Status</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 18px;
    }

    h2 {
      margin: 0 0 8px;
    }

    .meta {
      color: #666;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .toast {
      font-size: 12px;
      color: #333;
      padding: 6px 10px;
      border: 1px solid #ddd;
      background: #fafafa;
      border-radius: 6px;
      min-width: 260px;
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
      font-size: 13px;
      vertical-align: top;
    }

    th {
      background: #f7f7f7;
      text-align: left;
    }

    .pill {
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 12px;
      display: inline-block;
    }

    .starting {
      background: #fff3cd;
      color: #856404;
    }

    .running {
      background: #d4edda;
      color: #155724;
    }

    .failed {
      background: #f8d7da;
      color: #721c24;
    }

    .stopped {
      background: #e2e3e5;
      color: #383d41;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    button {
      padding: 7px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .btn {
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 6px;
    }

    .btn-primary {
      border-color: #1f6feb;
      color: #fff;
      background: #1f6feb;
    }

    .btn-danger {
      border-color: #d73a49;
      color: #fff;
      background: #d73a49;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .log {
      margin-top: 12px;
      border: 1px solid #ddd;
      padding: 8px;
      height: 220px;
      overflow: auto;
      white-space: pre-wrap;
      background: #fafafa;
      font-family: Consolas, monospace;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <h2>Starting services…</h2>
  <div class="meta" id="meta">Initializing…</div>

  <div class="toolbar">
    <button class="btn btn-primary" id="openLogin">Open Login (3000)</button>
    <button class="btn" id="openLogs">Open Logs Folder</button>
    <div class="toast" id="toast">Ready.</div>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width: 180px;">Service</th>
        <th style="width: 120px;">Status</th>
        <th style="width: 80px;">Port</th>
        <th style="width: 90px;">PID</th>
        <th>Message</th>
        <th style="width: 190px;">Actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="log" id="log"></div>

  <script>
    const { ipcRenderer } = require("electron");

    const rowsEl = document.getElementById("rows");
    const logEl = document.getElementById("log");
    const metaEl = document.getElementById("meta");
    const openLoginBtn = document.getElementById("openLogin");
    const openLogsBtn = document.getElementById("openLogs");
    const toastEl = document.getElementById("toast");

    // Map UI names to main.js keys
    const serviceKeyByName = {
      "MQTT": "mqttSub",
      "MQTT-QR": "mqttQr",
      "PHP-CGI": "phpCgi",
      "Nginx": "nginx",
      "Mosquitto": "mosquitto",
      "ArtisanServe": "artisanServe",
    };

    const state = {}; // serviceName => {status, port, pid, message}
    const busy = {};  // key => boolean (avoid double-click spam)

    function pillClass(s) {
      if (s === "starting") return "pill starting";
      if (s === "running") return "pill running";
      if (s === "failed") return "pill failed";
      return "pill stopped";
    }

    function setToast(text) {
      toastEl.textContent = text || "";
    }

    function appendLog(line) {
      logEl.textContent += line + "\n";
      logEl.scrollTop = logEl.scrollHeight;
    }

    function render() {
      rowsEl.innerHTML = "";

      Object.keys(state).forEach((name) => {
        const svc = state[name];
        const key = serviceKeyByName[name]; // may be undefined for unknown rows
        const isBusy = key ? !!busy[key] : false;

        const tr = document.createElement("tr");

        const canControl = !!key;
        const startDisabled = !canControl || isBusy || svc.status === "running" || svc.status === "starting";
        const restartDisabled = !canControl || isBusy;

        tr.innerHTML = `
          <td>${name}</td>
          <td><span class="${pillClass(svc.status)}">${svc.status}</span></td>
          <td>${svc.port ?? ""}</td>
          <td>${svc.pid ?? ""}</td>
          <td>${svc.message ?? ""}</td>
          <td>
            <div class="actions">
              <button class="btn btn-primary"
                data-action="start-service"
                data-key="${key || ""}"
                ${startDisabled ? "disabled" : ""}>
                Start
              </button>
              <button class="btn btn-danger"
                data-action="restart-service"
                data-key="${key || ""}"
                ${restartDisabled ? "disabled" : ""}>
                Restart
              </button>
            </div>
          </td>
        `;

        rowsEl.appendChild(tr);
      });
    }

    // -------------------- IPC Events from main.js --------------------
    ipcRenderer.on("svc:init", (_e, payload) => {
      metaEl.textContent = payload?.meta || "Starting…";
    });

    ipcRenderer.on("svc:update", (_e, payload) => {
      state[payload.name] = { ...(state[payload.name] || {}), ...payload };
      render();
      if (payload.message) appendLog(`[${payload.name}] ${payload.message}`);
    });

    ipcRenderer.on("svc:log", (_e, line) => appendLog(line));

    ipcRenderer.on("svc:ready", (_e, payload) => {
      metaEl.textContent = payload?.meta || "Ready.";
      appendLog(payload?.meta || "Ready.");
      setToast("All services started. You can open Login or view logs.");
    });

    ipcRenderer.on("svc:error", (_e, payload) => {
      metaEl.textContent = payload?.meta || "Startup error. See logs.";
      appendLog(payload?.meta || "Startup error.");
      setToast("Startup error. Open Logs Folder and check latest logs.");
    });

    // -------------------- Buttons --------------------
    openLoginBtn.addEventListener("click", async () => {
      try {
        await ipcRenderer.invoke("open-login");
      } catch (e) {
        setToast("Open Login failed. Check logs.");
      }
    });

    openLogsBtn.addEventListener("click", async () => {
      try {
        const folder = await ipcRenderer.invoke("open-logs-folder");
        setToast(`Opened logs: ${folder}`);
      } catch (e) {
        setToast("Open Logs failed. Check permissions.");
      }
    });

    // Start/Restart service buttons
    document.addEventListener("click", async (e) => {
      const startBtn = e.target.closest("[data-action='start-service']");
      const restartBtn = e.target.closest("[data-action='restart-service']");
      if (!startBtn && !restartBtn) return;

      const btn = startBtn || restartBtn;
      const key = btn.getAttribute("data-key");
      if (!key) {
        setToast("This service cannot be controlled from UI.");
        return;
      }

      if (busy[key]) return;
      busy[key] = true;
      render();

      try {
        if (startBtn) {
          setToast(`Starting: ${key} ...`);
          const res = await ipcRenderer.invoke("service:start", key);
          setToast(res?.ok ? `Started: ${key}` : `Start failed: ${key} (${res?.message || "error"})`);
          appendLog(`[UI] start ${key}: ${JSON.stringify(res)}`);
        } else {
          setToast(`Restarting: ${key} ...`);
          const res = await ipcRenderer.invoke("service:restart", key);
          setToast(res?.ok ? `Restarted: ${key}` : `Restart failed: ${key} (${res?.message || "error"})`);
          appendLog(`[UI] restart ${key}: ${JSON.stringify(res)}`);
        }
      } catch (err) {
        setToast(`Action failed for ${key}. Check logs.`);
        appendLog(`[UI] action error ${key}: ${err?.stack || err?.message || String(err)}`);
      } finally {
        busy[key] = false;
        render();
      }
    });
  </script>
</body>

</html>
